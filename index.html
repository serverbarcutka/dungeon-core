  else if(a=='rl'&&S.rp){S.rl.push(S.rp[i]);log('🎁 Реликвия: '+RL[S.rp[i]].n);S.rp=null}
  else if(a=='cl'&&S.dp>=cc()){S.dp-=cc();S.cl++;S.core+=20}
  else if(a=='fl'&&S.dp>=fc()&&S.fl.length<5){S.dp-=fc();S.fl.push([null,null,null]);S.tr.push(0);S.rm.push(0)}}
 draw()};

 if(S.ph=='prep'){S.t-=dt;if(EZ()&&n%10==0)S.fl.forEach(F=>F.forEach((m,j)=>{if(!m&&S.dp>=30){S.dp-=10;F[j]={f:'g',hp:20,k:0}}}));if(S.t<=0)start()}else{const q=SPD[S.sp].t;if(q&&n%q==0)rnd()}draw()},400);
